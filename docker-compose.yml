version: '3.8'

services:
  # Infrastructure
  rabbitmq:
    image: rabbitmq:3-management
    container_name: techcare_rabbitmq
    ports:
      - '${RABBITMQ_NODE_PORT}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - techcare_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: techcare_jaeger
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - techcare_network

  mongodb:
    image: mongo:latest
    container_name: techcare_mongodb
    ports:
      - '${MONGODB_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - techcare_network

  postgres:
    image: postgres:16-alpine
    container_name: techcare_postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - techcare_network

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: techcare_db_migrate
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
    networks:
      - techcare_network

  # Microservices
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: techcare
    container_name: techcare_gateway
    ports:
      - '${GATEWAY_PORT}:4000'
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user
    container_name: techcare_user
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product-manager
    container_name: techcare_product
    depends_on:
      rabbitmq:
        condition: service_started
      mongodb:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - MONGODB_URI=${MONGODB_URI_PRODUCT_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory-manager
    container_name: techcare_inventory
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: order-manager
    container_name: techcare_order
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-manager
    container_name: techcare_payment
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: notification-manager
    container_name: techcare_notification
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  file-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: file-manager
    container_name: techcare_file
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_CLOUDFRONT_URL=${AWS_CLOUDFRONT_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: cart-manager
    container_name: techcare_cart
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - techcare_network

volumes:
  mongodb_data:
  postgres_data:

networks:
  techcare_network:
    driver: bridge